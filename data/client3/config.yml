fc_kmeans:
  algorithm:
    k_max: 4
    k_min: 2
    k_step: 1
  input:
    delimiter: ;
    dir: data
    file: realData.csv
  output:
    centroids: centroids.csv
    clustering: clustering.csv
    delimiter: ;
    dir: kmeans
    silhouette: silhouette.csv
  scaling:
    center: true
    log_transform: false
    max_nan_fraction: 1
    variance: true